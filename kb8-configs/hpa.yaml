apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rtsm-hpa
  namespace: hydra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hydra-deployment

  minReplicas: 2               # never go below 2 (aligns with PDB below)
  maxReplicas: 10              # upper cap — tune to your cluster capacity

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # scale up when avg CPU > 70% of request
